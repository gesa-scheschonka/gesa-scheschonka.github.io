name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow the workflow to publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once; let a newer push finish rather than cancelling it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stage the site
        run: |
          mkdir -p _site
          rsync -a --exclude '.git' \
                   --exclude '.github' \
                   --exclude 'scripts' \
                   --exclude 'tests' \
                   --exclude '.venv' \
                   --exclude '.playwright-artifacts' \
                   --exclude '*.md' \
                   ./ _site/
          # Keep Jekyll away from the files; the site is plain static HTML.
          touch _site/.nojekyll

      - name: Inject imprint details from secrets
        env:
          SITE_EMAIL: ${{ secrets.SITE_EMAIL }}
          SITE_INSTAGRAM_URL: ${{ secrets.SITE_INSTAGRAM_URL }}
          SITE_LINKEDIN_URL: ${{ secrets.SITE_LINKEDIN_URL }}
          LEGAL_STREET: ${{ secrets.LEGAL_STREET }}
          LEGAL_POSTAL_CITY: ${{ secrets.LEGAL_POSTAL_CITY }}
          LEGAL_VAT_ID: ${{ secrets.LEGAL_VAT_ID }}
          LEGAL_FULL_NAME: ${{ secrets.LEGAL_FULL_NAME }}
          LEGAL_EDITORIAL_RESPONSIBLE: ${{ secrets.LEGAL_EDITORIAL_RESPONSIBLE }}
        run: python3 scripts/inject-legal.py _site

      - uses: actions/configure-pages@v5
        # Creates the Pages site on first run, so Pages does not have to be
        # switched on by hand in repository settings.
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
